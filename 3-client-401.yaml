apiVersion: apps/v1
kind: Deployment
metadata:
  name: wezva-core-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-server
  template:
    metadata:
      labels:
        app: web-server
    spec:
      containers:
      - name: python-app
        image: python:3.10-alpine
        command: ["/bin/sh", "-c"]
        args:
        - |
          cat << 'EOF' > server.py
          import http.server
          import socketserver

          class MyHandler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  # Respond with an explicit 401 Unauthorized status
                  self.send_response(401)
                  self.send_header('WWW-Authenticate', 'Basic realm="WezvaTech"')
                  self.send_header('Content-Type', 'text/plain')
                  self.end_headers()
                  # REMOVED EMOJI: Keeps the raw byte stream strictly ASCII compliant
                  self.wfile.write(b"WEZVATECH SECURITY: 401 Access Denied - Token Invalid\n")

          print("Starting security server on port 8080...")
          with socketserver.TCPServer(("0.0.0.0", 8080), MyHandler) as httpd:
              httpd.serve_forever()
          EOF
          python3 server.py
        ports:
        - containerPort: 8080

