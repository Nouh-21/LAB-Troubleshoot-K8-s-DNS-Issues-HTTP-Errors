apiVersion: apps/v1
kind: Deployment
metadata:
  name: wezva-core-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-server
  template:
    metadata:
      labels:
        app: web-server
    spec:
      containers:
      # CONTAINER 1: The Gateway Proxy Engine
      - name: gateway-proxy
        image: nginx:alpine
        command: ["/bin/sh", "-c"]
        args:
        - |
          cat << 'EOF' > /etc/nginx/nginx.conf
          events { worker_connections 1024; }
          http {
              server {
                  listen 8080;
                  location / {
                      proxy_pass http://127.0.0.1:8081;
                  }
              }
          }
          EOF
          nginx -g "daemon off;"
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            # INTENTIONAL FAILURE: This route does not exist, forcing a 404/failure
            path: /this-route-fails-on-purpose
            port: 8080
          initialDelaySeconds: 1
          periodSeconds: 1

      # CONTAINER 2: The Core Application Backend
      - name: python-app
        image: python:3.10-alpine
        command: ["/bin/sh", "-c"]
        args:
        - |
          cat << 'EOF' > server.py
          import http.server, socketserver
          class MyHandler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.send_header('Content-Type', 'text/plain')
                  self.end_headers()
                  self.wfile.write(b"WEZVATECH: Pod is Healthy\n")
          socketserver.TCPServer.allow_reuse_address = True
          with socketserver.TCPServer(("0.0.0.0", 8081), MyHandler) as httpd:
              httpd.serve_forever()
          EOF
          python3 server.py
        ports:
        - containerPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wezva-fallback-handler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fallback-handler
  template:
    metadata:
      labels:
        app: fallback-handler
    spec:
      containers:
      - name: fallback-nginx
        image: nginx:alpine
        command: ["/bin/sh", "-c"]
        args:
        - |
          cat << 'EOF' > /etc/nginx/nginx.conf
          events { worker_connections 1024; }
          http {
              server {
                  listen 8080;
                  location / {
                      return 503 "HTTP/1.1 503 Service Unavailable\n\nWEZVATECH INFRASTRUCTURE ERROR: 503 Service Unavailable - No Healthy Backend Pods Found!\n";
                  }
              }
          }
          EOF
          nginx -g "daemon off;"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: wezva-service
spec:
  type: NodePort
  selector:
    app: web-server # Tracks your application pod
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080

